      @keyframes counter2{to{transform:rotate(360deg)}}
      @keyframes counter3{to{transform:rotate(-360deg)}}
      @keyframes corepulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.28);opacity:.55}}
      @keyframes spark{0%,100%{opacity:.15}50%{opacity:.9}}
      .shell{transform-origin:470px 125px;transform-box:view-box}
      .planet{transform-origin:center;transform-box:fill-box}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>
