<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-label="Lo que construyo: aplicaciones web, escritorio, sistemas administrativos, herramientas, bases de datos, automatización, datos, IA (LLMs) y agentes">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="brd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#818cf8;#34d399;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#34d399;#22d3ee;#818cf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#22d3ee;#818cf8;#34d399" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip"><rect x="0" y="0" width="820" height="560" rx="24"/></clipPath>
    <clipPath id="c0"><rect x="44" y="95" width="0" height="24"><animate attributeName="width" from="0" to="220" begin="1.6s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c1"><rect x="44" y="133" width="0" height="24"><animate attributeName="width" from="0" to="325" begin="2.45s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="44" y="171" width="0" height="24"><animate attributeName="width" from="0" to="290" begin="3.3s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="44" y="209" width="0" height="24"><animate attributeName="width" from="0" to="278" begin="4.15s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="44" y="247" width="0" height="24"><animate attributeName="width" from="0" to="394" begin="5s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="44" y="285" width="0" height="24"><animate attributeName="width" from="0" to="325" begin="5.85s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="44" y="323" width="0" height="24"><animate attributeName="width" from="0" to="360" begin="6.7s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="44" y="361" width="0" height="24"><animate attributeName="width" from="0" to="418" begin="7.55s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c8"><rect x="44" y="399" width="0" height="24"><animate attributeName="width" from="0" to="418" begin="8.4s" dur="0.35s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0" y="0" width="820" height="560" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="816" height="556" rx="22" fill="none" stroke="url(#brd)" stroke-width="3"/>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="820" height="560" fill="url(#grid)" opacity="0.35"/>
    <rect x="-860" y="0" width="860" height="560" fill="url(#sweep)">
      <animate attributeName="x" values="-860;860" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <circle cx="34" cy="30" r="7" fill="#ff5f57">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="30" r="7" fill="#febc2e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="30" r="7" fill="#28c840">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="410" y="37" font-family="'Segoe UI','JetBrains Mono',Consolas,monospace" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">keinergarcia@elchivalez — ~/build — 9 módulos</text>
  </g>

  <g>
    <text x="44" y="78" font-family="'Segoe UI','JetBrains Mono',Consolas,monospace" font-size="19" font-weight="700" fill="#22d3ee">$</text>
    <text x="70" y="78" font-family="'Segoe UI','JetBrains Mono',Consolas,monospace" font-size="19" fill="#e2e8f0">keiner build --proyectos --módulos --modo=producción</text>
    <rect x="632" y="63" width="9" height="20" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="'Segoe UI','JetBrains Mono',Consolas,monospace" font-size="19">
    <g clip-path="url(#c0)"><text x="44" y="114" fill="#e2e8f0">▸ <tspan fill="#a5f3fc">Aplicaciones web</tspan></text></g>
    <text x="724" y="114" fill="#34d399" opacity="0">✓<animate attributeName="opacity" values="0;1" begin="2s" dur="0.2s" fill="freeze"/></text>

    <g clip-path="url(#c1)"><text x="44" y="152" fill="#e2e8f0">▸ <tspan fill="#c4b5fd">Aplicaciones de escritorio</tspan></text></g>
    <text x="724" y="152" fill="#34d399" opacity="0">✓<animate attributeName="opacity" values="0;1" begin="2.85s" dur="0.2s" fill="freeze"/></text>

    <g clip-path="url(#c2)"><text x="44" y="190" fill="#e2e8f0">▸ <tspan fill="#6ee7b7">Sistemas administrativos</tspan></text></g>
    <text x="724" y="190" fill="#34d399" opacity="0">✓<animate attributeName="opacity" values="0;1" begin="3.7s" dur="0.2s" fill="freeze"/></text>

    <g clip-path="url(#c3)"><text x="44" y="228" fill="#e2e8f0">▸ <tspan fill="#93c5fd">Herramientas de software</tspan></text></g>
    <text x="724" y="228" fill="#34d399" opacity="0">✓<animate attributeName="opacity" values="0;1" begin="4.55s" dur="0.2s" fill="freeze"/></text>

    <g clip-path="url(#c4)"><text x="44" y="266" fill="#e2e8f0">▸ <tspan fill="#fcd34d">Integraciones con bases de datos</tspan></text></g>
    <text x="724" y="266" fill="#34d399" opacity="0">✓<animate attributeName="opacity" values="0;1" begin="5.4s" dur="0.2s" fill="freeze"/></text>

    <g clip-path="url(#c5)"><text x="44" y="304" fill="#e2e8f0">▸ <tspan fill="#f9a8d4">Automatización de procesos</tspan></text></g>
    <text x="724" y="304" fill="#34d399" opacity="0">✓<animate attributeName="opacity" values="0;1" begin="6.25s" dur="0.2s" fill="freeze"/></text>

    <g clip-path="url(#c6)"><text x="44" y="342" fill="#e2e8f0">▸ <tspan fill="#fdba74">Soluciones orientadas a datos</tspan></text></g>
    <text x="724" y="342" fill="#34d399" opacity="0">✓<animate attributeName="opacity" values="0;1" begin="7.1s" dur="0.2s" fill="freeze"/></text>

    <g clip-path="url(#c7)"><text x="44" y="380" fill="#e2e8f0">▸ <tspan fill="#a5f3fc">Soluciones con modelos de IA (LLMs)</tspan></text></g>
    <text x="724" y="380" fill="#34d399" opacity="0">✓<animate attributeName="opacity" values="0;1" begin="7.95s" dur="0.2s" fill="freeze"/></text>

    <g clip-path="url(#c8)"><text x="44" y="418" fill="#e2e8f0">▸ <tspan fill="#c4b5fd">Agentes y automatización inteligente</tspan></text></g>
    <text x="724" y="418" fill="#34d399" opacity="0">✓<animate attributeName="opacity" values="0;1" begin="8.8s" dur="0.2s" fill="freeze"/></text>
  </g>

  <g>
    <text x="44" y="456" font-family="'Segoe UI','JetBrains Mono',Consolas,monospace" font-size="18" fill="#7dd3fc">progreso:</text>
    <rect x="150" y="446" width="480" height="14" rx="7" fill="#0f172a"/>
    <rect x="152" y="448" width="476" height="10" rx="5" fill="url(#barGrad)" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="8.9s" dur="0.1s" fill="freeze"/>
      <animate attributeName="width" from="0" to="476" begin="8.9s" dur="1.1s" fill="freeze"/>
    </rect>
    <text x="652" y="456" font-family="'Segoe UI','JetBrains Mono',Consolas,monospace" font-size="18" font-weight="700" fill="#34d399" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="10.1s" dur="0.2s" fill="freeze"/>100%</text>
  </g>

  <g filter="url(#neon)">
    <text x="44" y="512" font-family="'Segoe UI','JetBrains Mono',Consolas,monospace" font-size="24" font-weight="800" fill="#34d399" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="10.5s" dur="0.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.75;1" begin="11.2s" dur="1.6s" repeatCount="indefinite"/>✓ CONSTRUCCIÓN COMPLETA — 9 módulos en producción</text>
  </g>

  <g fill="#22d3ee" opacity="0">
    <circle cx="640" cy="320" r="2.5"><animate attributeName="opacity" values="0;0.8;0" dur="4s" begin="2s" repeatCount="indefinite"/><animate attributeName="cy" values="340;300" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="380" r="2"><animate attributeName="opacity" values="0;0.7;0" dur="5s" begin="3s" repeatCount="indefinite"/><animate attributeName="cy" values="400;360" dur="5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="746" cy="280" r="2"><animate attributeName="opacity" values="0;0.6;0" dur="4.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="cy" values="300;260" dur="4.5s" begin="4s" repeatCount="indefinite"/></circle>
  </g>
</svg>