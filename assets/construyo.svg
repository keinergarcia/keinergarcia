<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" role="img" aria-label="Lo que construyo: aplicaciones web, de escritorio, sistemas administrativos, herramientas de software, integraciones con bases de datos, automatización de procesos, soluciones orientadas a datos, soluciones con IA (LLMs) y agentes inteligentes">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="820" height="530" fill="url(#bg)"/>
  <rect x="0" y="0" width="820" height="530" fill="url(#grid)" opacity="0.35"/>

  <g font-family="'Segoe UI','JetBrains Mono',Consolas,monospace" font-size="19">
    <text x="44" y="64" fill="#e2e8f0">▸ <tspan fill="#a5f3fc">Aplicaciones web</tspan></text>
    <text x="724" y="64" fill="#34d399">✓<animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.08;1" dur="3s" begin="0s" repeatCount="indefinite"/></text>

    <text x="44" y="102" fill="#e2e8f0">▸ <tspan fill="#c4b5fd">Aplicaciones de escritorio</tspan></text>
    <text x="724" y="102" fill="#34d399">✓<animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.08;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></text>

    <text x="44" y="140" fill="#e2e8f0">▸ <tspan fill="#6ee7b7">Sistemas administrativos</tspan></text>
    <text x="724" y="140" fill="#34d399">✓<animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.08;1" dur="3s" begin="0.8s" repeatCount="indefinite"/></text>

    <text x="44" y="178" fill="#e2e8f0">▸ <tspan fill="#93c5fd">Herramientas de software</tspan></text>
    <text x="724" y="178" fill="#34d399">✓<animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.08;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></text>

    <text x="44" y="216" fill="#e2e8f0">▸ <tspan fill="#fcd34d">Integraciones con bases de datos</tspan></text>
    <text x="724" y="216" fill="#34d399">✓<animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.08;1" dur="3s" begin="1.6s" repeatCount="indefinite"/></text>

    <text x="44" y="254" fill="#e2e8f0">▸ <tspan fill="#f9a8d4">Automatización de procesos</tspan></text>
    <text x="724" y="254" fill="#34d399">✓<animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.08;1" dur="3s" begin="2s" repeatCount="indefinite"/></text>

    <text x="44" y="292" fill="#e2e8f0">▸ <tspan fill="#fdba74">Soluciones orientadas a datos</tspan></text>
    <text x="724" y="292" fill="#34d399">✓<animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.08;1" dur="3s" begin="2.4s" repeatCount="indefinite"/></text>

    <text x="44" y="330" fill="#e2e8f0">▸ <tspan fill="#a5f3fc">Soluciones con modelos de IA (LLMs)</tspan></text>
    <text x="724" y="330" fill="#34d399">✓<animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.08;1" dur="3s" begin="2.8s" repeatCount="indefinite"/></text>

    <text x="44" y="368" fill="#e2e8f0">▸ <tspan fill="#c4b5fd">Agentes y automatización inteligente</tspan></text>
    <text x="724" y="368" fill="#34d399">✓<animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.08;1" dur="3s" begin="3.2s" repeatCount="indefinite"/></text>
  </g>

  <g font-family="'Segoe UI','JetBrains Mono',Consolas,monospace">
    <text x="44" y="410" font-size="18" fill="#7dd3fc">progreso:</text>
    <rect x="150" y="400" width="480" height="14" rx="7" fill="#0f172a"/>
    <rect x="152" y="402" width="476" height="10" rx="5" fill="url(#barGrad)"/>
    <circle cx="150" cy="407" r="5" fill="#f0fdfa" opacity="0.9"><animate attributeName="cx" values="150;620" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <text x="652" y="410" font-size="18" font-weight="700" fill="#34d399">100%</text>
  </g>

  <g filter="url(#neon)">
    <text x="44" y="470" font-family="'Segoe UI','JetBrains Mono',Consolas,monospace" font-size="24" font-weight="800" fill="#34d399">
      <animate attributeName="opacity" values="1;0.8;1" dur="2.2s" repeatCount="indefinite"/>✓ CONSTRUCCIÓN COMPLETA — 9 módulos en producción</text>
  </g>

  <g>
    <circle cx="640" cy="300" r="2.5" fill="#22d3ee" opacity="0.7"><animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="320;280" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="360" r="2" fill="#34d399" opacity="0.7"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="380;340" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="746" cy="260" r="2" fill="#f0abfc" opacity="0.7"><animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite"/><animate attributeName="cy" values="280;240" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>